<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEYY Arcade — Offline</title><meta name="theme-color" content="#060608">
<style>
@font-face{font-family:"Inter";src:url(fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"InterTight";src:url(fonts/inter-tight.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Anton";src:url(fonts/anton.woff2) format("woff2");font-weight:400;font-display:swap}
html,body{margin:0;background:#060608;color:#f7f5f0;font-family:"Inter",system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(227,182,90,.14),transparent 60%),#060608;padding:22px 16px 40px}
h1{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:1px;font-size:38px;margin:6px 0 2px}h1 span{color:#e3b65a}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.6px;color:#15120a;background:linear-gradient(135deg,#fbe9b4,#e3b65a 45%,#b98a2e);padding:4px 9px;border-radius:999px}
p{color:#aaa8b2;line-height:1.5;margin:6px 0 16px}
.g{display:grid;gap:10px}
.g button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:18px;border:1px solid rgba(227,182,90,.28);background:linear-gradient(135deg,#1a150a,#0b0b0d 70%);color:#fff;font:inherit;cursor:pointer}
.g button:active{transform:scale(.98)}
.g .i{font-size:28px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid rgba(227,182,90,.28)}
.g b{display:block;font-size:16px}.g small{color:#aaa8b2;font-size:12.5px}
.all{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:800;color:#15120a;background:linear-gradient(135deg,#fbe9b4,#e3b65a 45%,#b98a2e)}
</style><link rel="stylesheet" href="games/arcade.css?v=2"></head><body>
<span class="tag">OFFLINE MODE</span>
<h1>HEYY <span>ARCADE</span></h1>
<p>Net nahi hai? Koi baat nahi — ye games phone me hi chalte hain. Score bhi save hota hai.</p>
<div class="g" id="g"></div>
<button class="all" id="all">🎮 Open full Arcade</button>
<script type="module">
import { openArcade } from './games/arcade.js?v=2';
const L=[['sled','🛷','HEYY SLED RUSH','Gulel launch + endless sled runner'],['stack','🧱','HEYY STACK','One-tap tower builder'],['jump','🪽','HEYY JUMP','Tap-to-fly challenge'],['aim','🎯','AIM RUSH 30s','Free Fire-style aim trainer']];
const g=document.getElementById('g');
for(const [id,ic,t,s] of L){const b=document.createElement('button');b.innerHTML=`<span class="i">${ic}</span><span><b>${t}</b><small>${s}</small></span>`;b.onclick=()=>openArcade(id);g.appendChild(b)}
document.getElementById('all').onclick=()=>openArcade('');
const m=location.hash.match(/^#play(?:-(\w+))?$/); if(m) openArcade(m[1]||'');
window.hxGames=L.map(x=>x[0]);
</script></body></html>
