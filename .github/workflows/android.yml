name: Build HEYYANIXX APK

# Runs on GitHub's machine (free), builds a debug APK.
# Trigger: every push to main, or manually from Actions > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply HEYYANIXX brand (adaptive icon, splash, theme, version)
        run: |
          RES=android/app/src/main/res
          # remove the Capacitor template's default icon + splash files
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24/ic_launcher_foreground.xml \
                 $RES/drawable/ic_launcher_background.xml $RES/values/ic_launcher_background.xml
          find $RES -name 'splash.png' -delete
          find $RES -type d -empty -delete
          # copy the HEYYANIXX resources (resources/android/res) on top
          cp -r resources/android/res/. $RES/
          # HEYYANIXX shell activity (routes new-window links into the in-app hub)
          cp resources/android/java/com/heyyanixx/app/MainActivity.java android/app/src/main/java/com/heyyanixx/app/MainActivity.java
          # app version shown in Android settings
          sed -i -E "s/versionCode [0-9]+/versionCode ${APP_VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${APP_VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          chmod +x android/gradlew
        env:
          APP_VERSION_NAME: "2.1.0"
          APP_VERSION_CODE: "210"

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heyyanixx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (public download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk heyyanixx-app-debug.apk
          gh release create "build-${{ github.run_number }}" heyyanixx-app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "HEYYANIXX app v2.1.0 — build ${{ github.run_number }}" \
            --notes "HEYYANIXX v2.1.0 — app hub: Games, Learn Arcade, ADCA Tools and Portfolio open live inside the app (offline copies of the games built in), new gold HX icon, splash and black + gold theme. Android APK (debug build): download heyyanixx-app-debug.apk on your phone and install it (allow 'install unknown apps' once). If Android says the app conflicts with an existing one, uninstall the old HEYYANIXX first." \
            --latest
