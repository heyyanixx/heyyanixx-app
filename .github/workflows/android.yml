name: Build HEYYANIXX APK

# Runs on GitHub's machine (free), builds a debug APK.
# Trigger: every push to main, or manually from Actions > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply HEYYANIXX brand (adaptive icon, splash, theme, version)
        run: |
          RES=android/app/src/main/res
          # remove the Capacitor template's default icon + splash files
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24/ic_launcher_foreground.xml \
                 $RES/drawable/ic_launcher_background.xml $RES/values/ic_launcher_background.xml
          find $RES -name 'splash.png' -delete
          find $RES -type d -empty -delete
          # copy the HEYYANIXX resources (resources/android/res) on top
          cp -r resources/android/res/. $RES/
          # HEYYANIXX shell activity (routes new-window links into the in-app hub)
          cp resources/android/java/com/heyyanixx/app/MainActivity.java android/app/src/main/java/com/heyyanixx/app/MainActivity.java
          # app version shown in Android settings
          sed -i -E "s/versionCode [0-9]+/versionCode ${APP_VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${APP_VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          chmod +x android/gradlew
        env:
          APP_VERSION_NAME: "2.2.0"
          APP_VERSION_CODE: "220"

      - name: Use the permanent HEYYANIXX signing key (from repo secrets)
        env:
          HX_KEYSTORE_BASE64: ${{ secrets.HX_KEYSTORE_BASE64 }}
        run: |
          # The keystore lives ONLY in GitHub Actions secrets (never in this repo).
          # Same key every build => new versions install over the old app, no uninstall.
          if [ -z "$HX_KEYSTORE_BASE64" ]; then
            echo "::warning::HX_KEYSTORE_BASE64 secret not set - building with a throwaway debug key"
            exit 0
          fi
          echo "$HX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/heyyanixx-release.jks"
          echo "HX_KEYSTORE_FILE=$RUNNER_TEMP/heyyanixx-release.jks" >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'

          // HEYYANIXX: sign with the permanent key when the CI secrets are present
          if (System.getenv("HX_KEYSTORE_FILE")) {
              android {
                  signingConfigs {
                      heyyanixx {
                          storeFile file(System.getenv("HX_KEYSTORE_FILE"))
                          storePassword System.getenv("HX_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("HX_KEY_ALIAS")
                          keyPassword System.getenv("HX_KEY_PASSWORD")
                      }
                  }
                  buildTypes {
                      debug { signingConfig signingConfigs.heyyanixx }
                      release { signingConfig signingConfigs.heyyanixx }
                  }
              }
          }
          GRADLE

      - name: Build debug APK with Gradle
        working-directory: android
        env:
          HX_KEYSTORE_PASSWORD: ${{ secrets.HX_KEYSTORE_PASSWORD }}
          HX_KEY_ALIAS: ${{ secrets.HX_KEY_ALIAS }}
          HX_KEY_PASSWORD: ${{ secrets.HX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --stacktrace
          # print the signing certificate so every build log shows it is the same key
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heyyanixx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (public download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk heyyanixx-app-debug.apk
          gh release create "build-${{ github.run_number }}" heyyanixx-app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "HEYYANIXX app v2.2.0 — build ${{ github.run_number }}" \
            --notes "HEYYANIXX v2.2.0 — new Notes AI tile in the hub (opens HEYYANIXX Notes AI inside the app), and the app is now signed with one permanent HEYYANIXX key: from v2.2.0 on, every update installs over the old app — no uninstall needed. Coming from v2.1 or older? Uninstall the old HEYYANIXX once, then install this. Android APK: download heyyanixx-app-debug.apk on your phone and install it (allow 'install unknown apps' once)." \
            --latest
